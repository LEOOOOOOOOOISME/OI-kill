<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OI杀 v4.0 — 重构版（可玩）</title>
<style>
:root{ /* P6a: 与 recon-07 §1.2 token 表对齐;faint 提对比度≥4.5:1(改进#14) */
  --bg:#f6f8fa; --bg2:#eef1f4; --panel:#fff; --panel2:#f0f3f6; --panel3:#e6ebf0;
  --line:#d0d7de; --line2:#b8c2cd;
  --blue:#0969da; --green:#1a7f37; --red:#cf222e; --orange:#953800;
  --purple:#8250df; --yellow:#9a6700; --text:#1f2328; --dim:#57606a; --faint:#6a7684;
  --shadow:0 2px 10px rgba(31,35,40,.08);
  --glow:0 2px 12px rgba(9,105,218,.16);
  --hot-bg:#f0faf3; --warn-bg:#fdf6ec; --bad-bg:#fdf0f1; --front-bg:#eef6ff;
  --banner-bg:#fdf0f1; --banner-line:#eec0c4; --banner-tx:#a8242e;
  --card-grad:linear-gradient(165deg,#fff,#f2f5f8);
  --suit-black:#38424d; --seat-front-line:#7ab4e8; --unit-bg:#f6f0fc; --unit-line:#c9aee8;
  --judge-bg:#fdf8ec; --judge-line:#d8bd7a;
  --table-bg:radial-gradient(ellipse at center,#edf3f9 0%,var(--bg) 72%);
  --modal-mask:rgba(31,35,40,.35); --halo:rgba(26,127,55,.12);
  --switch-on-bg:#eef6ff; --switch-on-line:#7ab4e8; --switch-on-tx:var(--blue);
  --flash-red:rgba(207,34,46,.55); --flash-blue:rgba(9,105,218,.55); --flash-green:rgba(26,127,55,.55); /* 改进#6 */
  --mono:"Cascadia Code","JetBrains Mono",Consolas,"Courier New",monospace;
}
body.dark{ /* 与 :root 变量名一一对应,不得增删 */
  --bg:#07090c; --bg2:#0b0f14; --panel:#10151c; --panel2:#151b24; --panel3:#1a2230;
  --line:#1e2836; --line2:#2a3a50;
  --blue:#5aa7e0; --green:#4ec9b0; --red:#f44747; --orange:#d19a66;
  --purple:#c586c0; --yellow:#dcdcaa; --text:#d7dde6; --dim:#8b95a5; --faint:#7a8696;
  --shadow:0 4px 18px rgba(0,0,0,.5);
  --glow:0 0 14px rgba(94,176,224,.22);
  --hot-bg:#0f2b1d; --warn-bg:#2b2210; --bad-bg:#2b1214; --front-bg:#0e2233;
  --banner-bg:rgba(244,71,71,.1); --banner-line:rgba(244,71,71,.4); --banner-tx:#e8a0a8;
  --card-grad:linear-gradient(160deg,#141b25,#0d1219);
  --suit-black:#9fb2c8; --seat-front-line:#3b82c9; --unit-bg:rgba(197,134,192,.08); --unit-line:#a86fc7;
  --judge-bg:rgba(209,154,102,.08); --judge-line:#6b4a2a;
  --table-bg:radial-gradient(ellipse at center,#0d141c 0%,var(--bg) 72%);
  --modal-mask:rgba(4,6,9,.72); --halo:rgba(78,201,176,.2);
  --switch-on-bg:#12222e; --switch-on-line:#2d6a80; --switch-on-tx:var(--green);
  --flash-red:rgba(244,71,71,.55); --flash-blue:rgba(90,167,224,.55); --flash-green:rgba(78,201,176,.55);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;font-size:14px;background:var(--bg);color:var(--text);overflow:hidden;user-select:none;transition:background .25s,color .25s}
#scaler{position:relative;width:100vw;height:100vh;transform-origin:0 0}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px}::-webkit-scrollbar-track{background:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.mono{font-family:var(--mono)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:7px;border:1px solid var(--line2);background:var(--panel);color:var(--text);font-size:13px;transition:all .15s;white-space:nowrap}
.btn:hover{border-color:var(--blue);box-shadow:var(--glow)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--switch-on-bg);border-color:var(--switch-on-line);color:var(--switch-on-tx)}
.btn.green{background:var(--hot-bg);border-color:var(--green);color:var(--green)}
.btn.danger{border-color:var(--red);color:var(--red)}
.btn.sm{padding:5px 12px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.tag{display:inline-block;font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:4px;border:1px solid var(--line2);color:var(--dim);background:var(--panel);white-space:nowrap}
.tag.hot{border-color:var(--green);color:var(--green);background:var(--hot-bg)}
.tag.warn{border-color:var(--orange);color:var(--orange);background:var(--warn-bg)}
.tag.bad{border-color:var(--red);color:var(--red);background:var(--bad-bg)}
.tag.front-tag{border-color:var(--blue);color:var(--blue);background:var(--front-bg)}
.kbd{font-family:var(--mono);font-size:11px;color:var(--dim)}
.switch{display:flex;gap:2px;border:1px solid var(--line2);border-radius:8px;padding:2px;background:var(--bg2);font-family:var(--mono);font-size:12px;flex:none}
.switch span{padding:4px 10px;border-radius:6px;cursor:pointer;color:var(--faint);white-space:nowrap;transition:all .15s;border:1px solid transparent}
.switch span:hover{color:var(--text);background:var(--panel)}
.switch span.on{background:var(--panel);color:var(--blue);font-weight:600;border-color:var(--line2);box-shadow:0 1px 4px rgba(31,35,40,.12)}
body.dark .switch span.on{color:var(--green)}
.name-plain{display:none}
body.plain-mode .name-zh{display:none}
body.plain-mode .name-plain{display:inline}

#page-game{display:flex;flex-direction:column;height:100%;min-height:0}
.game-top{display:flex;align-items:center;gap:12px;height:52px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line);flex:none;font-family:var(--mono);font-size:12px;min-width:0;overflow-x:auto;overflow-y:hidden}
.event-banner{flex:1;display:flex;align-items:center;gap:8px;padding:6px 14px;border-radius:6px;background:var(--banner-bg);border:1px solid var(--banner-line);color:var(--banner-tx);font-size:12px;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;animation:bannerIn .4s ease}
@keyframes bannerIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.game-body{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 270px;overflow:hidden;min-height:0}
.table-wrap{position:relative;display:flex;align-items:stretch;justify-content:center;justify-content:safe center;overflow:auto;background:var(--table-bg);min-width:0}
.stage{flex:1;display:flex;flex-direction:column;min-width:640px;min-height:660px;max-width:1240px;padding:14px 18px}
.table-title{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:2px 2px 10px;font-size:12px;color:var(--dim)}
.table-title b{font-size:14px;color:var(--text)}
.seats-area{flex:1;display:flex;flex-direction:column;justify-content:center;justify-content:safe center;gap:10px;min-height:0;overflow:auto}
.seat-grid{flex:1;display:flex;flex-direction:column;justify-content:center;justify-content:safe center;gap:14px;min-height:0}
.seat-row{display:flex;justify-content:center;align-items:stretch;gap:14px;flex-wrap:wrap}
.seat{flex:0 1 226px;min-width:196px;padding:14px 16px 12px;border-radius:14px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);font-size:12px;position:relative;transition:.2s}
.seat.dead{opacity:.4;filter:grayscale(1)}
.seat.me{border-width:2px;border-color:var(--green)}
.seat.targetable{border:2px dashed var(--blue);cursor:pointer;animation:targ 1.2s ease-in-out infinite}
@keyframes targ{0%,100%{box-shadow:0 0 0 3px rgba(9,105,218,.12)}50%{box-shadow:0 0 0 7px rgba(9,105,218,.22)}}
/* P6a: 受击/格挡/治疗状态动画(recon-07 §5) */
.seat.hit{animation:seatHit .35s ease,flashRed .5s ease}
.seat.blocked{animation:flashBlue .5s ease}
.seat.heal{animation:flashGreen .6s ease}
@keyframes seatHit{0%,100%{transform:none}20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
@keyframes flashRed{0%{box-shadow:0 0 0 0 var(--flash-red)}100%{box-shadow:0 0 0 14px transparent}}
@keyframes flashBlue{0%{box-shadow:0 0 0 0 var(--flash-blue)}100%{box-shadow:0 0 0 14px transparent}}
@keyframes flashGreen{0%{box-shadow:0 0 0 0 var(--flash-green)}100%{box-shadow:0 0 0 14px transparent}}
.seat .seat-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.seat .head{display:flex;align-items:center;gap:11px;margin-bottom:10px}
.seat .avatar{width:46px;height:46px;border-radius:12px;background:var(--panel3);display:flex;align-items:center;justify-content:center;font-size:23px;border:1px solid var(--line2);flex:none}
.seat .who{flex:1;min-width:0}
.seat .who .nick{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px;line-height:1.3}
.seat .who .job{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seat .ident{font-size:10px;font-family:var(--mono);color:var(--yellow);border:1px solid var(--judge-line);padding:2px 7px;border-radius:6px;background:var(--judge-bg);flex:none;font-weight:700}
.seat .ident.hidden{color:var(--faint);border-color:var(--line2);background:var(--bg2);font-weight:400}
.seat .stat{display:flex;align-items:center;gap:8px;margin-top:6px;font-family:var(--mono);font-size:11px;color:var(--dim)}
.seat .stat .cells{letter-spacing:3px;font-size:14px;line-height:1}
.seat .stat .cells .on{color:var(--red)} .seat .stat .cells .off{color:var(--line2)}
.seat .stat.mp .cells{letter-spacing:4px;font-size:12px}
.seat .stat.mp .cells .on{color:var(--blue)} .seat .stat.mp .cells .off{color:var(--line2)}
.seat .stat .val{margin-left:auto;font-weight:700;color:var(--text)}
.seat .chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.eq{font-size:11px;padding:2px 8px;border-radius:6px;border:1px solid var(--line2);background:var(--bg2);color:var(--dim);font-family:var(--mono);white-space:nowrap}
.unit-chip{font-size:10.5px;padding:2px 8px;border-radius:6px;border:1px solid var(--unit-line);color:var(--purple);background:var(--unit-bg);font-family:var(--mono);white-space:nowrap;transition:.4s}
.unit-chip.die{animation:unitDie .5s ease forwards}
@keyframes unitDie{to{opacity:0;transform:scale(.5) rotate(8deg);max-width:0;padding:0;border-width:0}}
.judge-chip{font-size:10px;font-family:var(--mono);color:var(--orange);border:1px dashed var(--judge-line);border-radius:6px;padding:2px 8px;display:inline-block;background:var(--judge-bg)}
.judge-chip.pop{animation:judgeFlip .6s ease}
@keyframes judgeFlip{0%{transform:perspective(400px) rotateY(90deg);opacity:0}60%{transform:perspective(400px) rotateY(-12deg);opacity:1}100%{transform:perspective(400px) rotateY(0);opacity:1}}
.turn-halo{position:absolute;inset:-3px;border-radius:14px;border:1.5px solid var(--green);box-shadow:0 0 0 3px var(--halo);pointer-events:none;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
.player-zone{flex:none;height:206px;display:grid;grid-template-columns:minmax(0,1fr) 206px;gap:12px;align-items:stretch;margin-top:2px}
.hand-box{display:flex;flex-direction:column;gap:5px;min-width:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;padding-top:12px}
.hand-note{text-align:center;font-family:var(--mono);font-size:11px;color:var(--dim)}
.hand{display:flex;gap:9px;justify-content:center;justify-content:safe center;align-items:flex-end;flex:1;min-height:0;padding:0 6px 4px;min-width:max-content}
.card{width:100px;height:142px;border:1px solid var(--line2);border-radius:8px;background:var(--card-grad);position:relative;cursor:pointer;transition:all .16s;flex:none;box-shadow:var(--shadow);padding:0;text-align:left}
.card:hover{transform:translateY(-10px) scale(1.05);border-color:var(--blue);box-shadow:0 8px 20px rgba(31,35,40,.16);z-index:5}
.card.selected{transform:translateY(-18px) scale(1.07);border-color:var(--green);box-shadow:0 0 0 3px var(--halo);z-index:6}
.card.playable{border-color:var(--green);box-shadow:0 0 0 2px var(--halo)}
.card.discard-sel{transform:translateY(-12px);border-color:var(--red);box-shadow:0 0 0 3px rgba(207,34,46,.22);z-index:6}
.card.shake{animation:cardShake .3s ease-in-out 2}
@keyframes cardShake{0%,100%{transform:translateY(-18px) scale(1.07)}25%{transform:translateY(-18px) scale(1.07) translateX(-3px)}75%{transform:translateY(-18px) scale(1.07) translateX(3px)}}
.card .cost{position:absolute;top:5px;left:7px;font-family:var(--mono);font-size:12px;color:var(--orange);font-weight:700}
.card .suit{position:absolute;top:4px;right:7px;font-size:14px}
.card .suit.red{color:var(--red)} .card .suit.black{color:var(--suit-black)}
.card .cname{position:absolute;top:31px;left:5px;right:5px;text-align:center;font-weight:700;font-size:13px;line-height:1.2}
.card .csub{position:absolute;top:54px;left:5px;right:5px;text-align:center;font-size:10px;color:var(--faint)}
.card .ctype{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-family:var(--mono);font-size:9.5px;color:var(--blue)}
.card.trick .ctype{color:var(--purple)} .card.equip .ctype{color:var(--yellow)} .card.unit .ctype{color:var(--green)}
.actions{padding:10px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:7px;min-width:0;overflow:hidden}
.actions .row{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11.5px;min-width:0;flex-wrap:wrap}
.side-log{display:flex;flex-direction:column;border-left:1px solid var(--line);background:var(--panel);min-width:0;min-height:0}
.side-log h3{padding:12px 14px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:12px;color:var(--dim)}
.side-log h3::before{content:"// ";color:var(--green)}
.log-body{flex:1;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:8px;font-size:12px;line-height:1.5;min-height:0}
.log-item{color:var(--dim)} .log-item .t{font-family:var(--mono);font-size:10px;color:var(--faint);margin-right:6px}
/* P6a: logIn 挂在最新一条(渲染整列重建,只播末条避免整列重放) */
.log-item:last-child{animation:logIn .3s ease}
@keyframes logIn{from{opacity:0;transform:translateX(8px)}to{opacity:1;transform:none}}
.log-item.act{color:var(--text);border-left:2px solid var(--green);padding-left:8px}
.log-item.evt{color:var(--orange);border-left:2px solid var(--orange);padding-left:8px}
.log-item.bad{color:var(--red)}
.modal-mask{position:fixed;inset:0;background:var(--modal-mask);display:none;align-items:center;justify-content:center;z-index:300}
.modal-mask.show{display:flex;animation:maskIn .2s ease}
.modal-mask.show .modal{animation:modalIn .3s cubic-bezier(.2,.9,.3,1.2)}
@keyframes maskIn{from{opacity:0}to{opacity:1}}
@keyframes modalIn{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
.ach-pop{animation:achPop .4s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes achPop{from{opacity:0;transform:scale(.8) translateY(8px)}to{opacity:1;transform:none}}
#table-title.game-over{animation:victoryIn .5s ease}
@keyframes victoryIn{0%{opacity:0;transform:translateY(8px) scale(.97)}60%{opacity:1;transform:scale(1.02)}100%{opacity:1;transform:none}}
.modal{width:min(440px,92vw);max-height:84vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.modal .mbar{padding:10px 14px;background:var(--panel2);border-bottom:1px solid var(--line);font-family:var(--mono);font-size:13px;color:var(--dim)}
.modal .mbody{padding:16px 20px;display:flex;flex-direction:column;gap:12px}
.tip{position:fixed;z-index:290;width:236px;background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:12px;font-size:12px;display:none;pointer-events:none;box-shadow:0 10px 30px rgba(31,35,40,.25)}
.tip .t-name{font-weight:700;color:var(--green);margin-bottom:6px}
.tip .t-body{color:var(--dim);line-height:1.6}
/* L: 45s/10s 环形倒计时(conic-gradient), <=10s 变红脉动 */
.timer-ring{width:24px;height:24px;border-radius:50%;flex:none;position:relative;background:conic-gradient(var(--ring-color,var(--orange)) calc(var(--ring-frac,0)*1%),var(--panel3) 0);transition:background .2s;margin-left:2px}
.timer-ring::after{content:'';position:absolute;inset:3px;border-radius:50%;background:var(--panel)}
.timer-ring .tt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:8.5px;font-family:var(--mono);color:var(--dim);z-index:1}
.timer-ring.low{animation:ringPulse .8s ease-in-out infinite}
@keyframes ringPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
/* P6a: 战斗反馈层(标准 z-index 栈: 弹窗300 > 提示290 > 浮字210 > 特效205 > 飞卡200 > 选中6 > 悬停5) */
.card.flying{position:fixed;z-index:200;pointer-events:none;transition:transform .45s cubic-bezier(.3,.7,.4,1),opacity .45s}
.dmg-float{position:fixed;z-index:210;font-family:var(--mono);font-weight:800;font-size:22px;color:var(--red);pointer-events:none;animation:floatUp 1s ease forwards;text-shadow:0 2px 6px rgba(0,0,0,.3)}
.dmg-float.heal{color:var(--green)}
.dmg-float.mp{color:var(--blue);font-size:17px}
@keyframes floatUp{0%{opacity:0;transform:translateY(6px) scale(.8)}20%{opacity:1;transform:translateY(0) scale(1.15)}100%{opacity:0;transform:translateY(-46px) scale(1)}}
.spark{position:fixed;z-index:205;pointer-events:none;font-size:20px;animation:sparkle .9s ease forwards}
@keyframes sparkle{0%{opacity:0;transform:scale(.3) rotate(0)}50%{opacity:1;transform:scale(1.2) rotate(180deg)}100%{opacity:0;transform:scale(.6) rotate(360deg)}}
.suit-bounce{position:fixed;z-index:205;pointer-events:none;font-size:52px;animation:suitBounce 1.1s ease forwards}
@keyframes suitBounce{0%{opacity:0;transform:translateY(-30px) scale(.4)}35%{opacity:1;transform:translateY(0) scale(1.35)}60%{transform:scale(.95)}100%{opacity:0;transform:translateY(14px) scale(1)}}
body.reduced *{animation-duration:.01s!important;transition-duration:.01s!important}
/* L: 轻量 toast(弃牌失败等提示) */
.toast{position:fixed;top:64px;left:50%;transform:translateX(-50%);z-index:290;background:var(--panel);border:1px solid var(--red);color:var(--red);padding:10px 18px;border-radius:8px;box-shadow:var(--shadow);font-size:13px;font-weight:600;display:none;max-width:80vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;animation:toastIn .25s ease}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-8px)}to{opacity:1;transform:translate(-50%,0)}}
/* P6a: 响应式地基——窄屏座位横排顶栏、手牌区保持可用(不建大厅页) */
@media (max-width:1024px){
  .game-body{grid-template-columns:minmax(0,1fr) 220px}
}
@media (max-width:820px){
  .game-top{gap:8px}
  .game-body{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
  .side-log{max-height:170px;border-left:none;border-top:1px solid var(--line)}
  .stage{min-width:0;min-height:0;padding:10px 12px}
  .seats-area{flex:none;justify-content:flex-start;gap:8px;overflow:visible}
  .seat-grid{flex:none;flex-direction:row;flex-wrap:nowrap;justify-content:flex-start;gap:10px;overflow-x:auto;overflow-y:hidden;padding-bottom:8px;scrollbar-width:thin}
  .seat-row{flex-wrap:nowrap;flex:none}
  .seat{flex:0 0 200px;min-width:200px}
  .player-zone{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto;gap:8px}
  .hand{justify-content:flex-start}
}
</style>
</head>
<body>
<div id="scaler">
<div id="page-game">
  <div class="game-top">
    <span class="mono" id="room-info" style="color:var(--blue)">OI杀 v4.0</span>
    <div class="event-banner" id="event-banner">—</div>
    <span id="turn-info" style="color:var(--green);white-space:nowrap">—</span>
    <div class="switch" id="sw-mode"><span class="on" data-v="zh">OI黑话</span><span data-v="plain">通俗版</span></div>
    <button class="btn sm" id="btn-theme">🌙</button>
    <button class="btn sm" id="btn-scale">🔍 缩放</button>
    <button class="btn sm" onclick="restart()">↺ 重开</button>
  </div>
  <div class="game-body">
    <div class="table-wrap">
      <div class="stage">
        <div class="table-title" id="table-title"></div>
        <div class="seats-area">
          <div class="seat-grid" id="seat-grid"></div>
        </div>
        <div class="player-zone">
          <div class="hand-box">
            <div class="hand-note" id="hand-note">—</div>
            <div class="hand" id="hand"></div>
          </div>
          <div class="actions">
            <div class="row"><span class="kbd" id="phase-info">—</span><span class="timer-ring" id="timer-ring" style="display:none"><span class="tt"></span></span><span class="kbd" id="timer-info" style="color:var(--orange);white-space:nowrap"></span></div>
            <div class="row" id="skill-row" style="display:none"></div>
            <div class="row" style="flex-direction:column;gap:8px;align-items:stretch">
              <button class="btn green" id="btn-end">✓ 结束出牌</button>
              <button class="btn sm" id="btn-ksp" style="display:none">⚔ 手写快排:2牌当攻</button>
              <button class="btn sm" id="btn-fang-confirm" style="display:none">⚔ 确认攻击目标</button>
              <button class="btn sm" id="btn-fun-play" style="display:none">🃏 打出欢乐牌</button>
              <button class="btn sm" id="btn-fun-discard" style="display:none">🗑 弃置触发保底</button>
              <button class="btn danger sm" id="btn-cancel">ESC 取消选中</button>
              <button class="btn sm" id="btn-auto">▶ 自动托管(测试)</button>
              <button class="btn sm" id="btn-tutor">🎓 教学模式</button>
              <button class="btn sm" id="btn-gallery">🃏 卡牌图鉴</button>
            </div>
            <div class="row" id="hint-line"><span class="kbd">点击手牌出牌 · 攻击需选择目标</span></div>
          </div>
        </div>
      </div>
    </div>
    <div class="side-log">
      <h3>行动日志 — LOG</h3>
      <div class="log-body" id="logbody"></div>
    </div>
  </div>
</div>
</div>
<div class="modal-mask" id="modal">
  <div class="modal">
    <div class="mbar" id="modal-title">提示</div>
    <div class="mbody" id="modal-body"></div>
  </div>
</div>
<div class="tip" id="tip"></div>
<div class="toast" id="toast"></div>
<script src="src/data/cards.js"></script>
<script src="src/data/professions.js"></script>
<script src="src/data/identities.js"></script>
<script src="src/engine/core.js"></script>
<script src="src/engine/battle.js"></script>
<script src="src/engine/tricks.js"></script>
<script src="src/engine/skills.js"></script>
<script src="src/engine/index.js"></script>
<script src="game.js"></script>
<script>
const O = window.OIKill;
const HUMAN = 0;
const NAMES = ['你', '大犇', '出题家', 'AK_King', '初音未来', '摸鱼王'];
const AVATARS = ['🦾', '🐂', '🧪', '🤖', '🎀', '🐟'];
let g = null, selected = -1, autoMode = false;

/* ---------- 职业技能表(与引擎 skillUse 的 skillName 对齐) ---------- */
const SKILLS = {
  shenben:  { name: 'akioi',   zh: '神犇AKIOI', desc: '弃2张手牌发动', need: 2, target: false, limited: false },
  duliu:    { name: 'kachang', zh: '毒瘤卡常', desc: '弃1张手牌,本次攻击不可被WA', need: 1, target: false, limited: false },
  nvzhuang: { name: 'live',    zh: '女装直播', desc: '弃1张红牌,看目标手牌并拿1张', needRed: 1, target: true, limited: false },
  pingce:   { name: 'rejudge', zh: '评测姬重测', desc: '受伤判定重测(免伤)', target: false, limited: false },
  chuangqi: { name: 'seal',    zh: '传奇封神', desc: '限定技:展示手牌,目标受1伤', target: true, limited: true },
  xuezhang: { name: 'teach',   zh: '学长讲题', desc: '弃1张手牌,令一名玩家摸1', need: 1, target: true, limited: false },
  dabiao:   { name: 'dabiao',  zh: '打表', desc: '弃2摸4', need: 2, target: false, limited: false },
  jianpan:  { name: 'kouhai',  zh: '键盘侠口嗨', desc: '弃1张手牌,令一名玩家弃1', need: 1, target: true, limited: false },
  chaoti:   { name: 'chao',    zh: '抄题解', desc: '弃1张手牌,看牌堆顶3取1', need: 1, target: false, limited: false },
  shuiqun:  { name: 'shuiqun', zh: '水群怪', desc: '弃1摸2弃1', need: 1, target: false, limited: false },
  baoling:  { name: 'baoling', zh: '爆零', desc: '弃1张手牌,令一名玩家弃1或受1伤', need: 1, target: true, limited: false },
  tuling:   { name: 'dianji',  zh: '图灵奠基', desc: '限定技:手牌上限+2', target: false, limited: true },
};
const usedLimited = new Set();   // 本局已使用的限定技
let gameOverShown = false;       // 结算弹窗只弹一次
let shownPromptKey = '';         // 当前已展示的响应弹窗标识
let skillTargetName = '';        // 目标类技能名

/* ---------- 缩放/主题/命名 ---------- */
const SCALES = [0.85, 1, 1.15, 1.3]; // P6a: 四档 小/标准/大/特大(标准 §2)
let UI_SCALE = 1;
function applyScale(v){
  UI_SCALE = v;
  const s = document.getElementById('scaler');
  s.style.width = (100/v) + 'vw';
  s.style.height = (100/v) + 'vh';
  s.style.transform = 'scale(' + v + ')';
}
document.getElementById('btn-scale').addEventListener('click', () => {
  const idx = SCALES.indexOf(UI_SCALE);
  applyScale(SCALES[(idx + 1) % SCALES.length]);
});
document.getElementById('btn-theme').addEventListener('click', () => {
  document.body.classList.toggle('dark');
  document.getElementById('btn-theme').textContent = document.body.classList.contains('dark') ? '☀️' : '🌙';
});
document.getElementById('sw-mode').addEventListener('click', e => {
  const s = e.target.closest('span'); if (!s) return;
  document.querySelectorAll('#sw-mode span').forEach(x => x.classList.toggle('on', x === s));
  document.body.classList.toggle('plain-mode', s.dataset.v === 'plain');
  if (g) render(); // L: 命名切换同步作用于日志
});

/* ---------- 工具 ---------- */
function esc(s){ return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function cells(on, off, ch){ return '<span class="on">' + ch.repeat(on) + '</span><span class="off">' + ch.repeat(off) + '</span>'; }
function typeZh(t){ return {basic:'BASIC',trick:'TRICK',equip:'EQUIP',unit:'UNIT'}[t] || ''; }
function isRedSuit(s){ return s === 'heart' || s === 'diamond'; }
function playerName(pid){ return g && g.players[pid] ? g.players[pid].name : '?'; }
function logToHtml(v){
  const el = document.getElementById('logbody');
  el.innerHTML = v.log.map(l => {
    // H10: 内奸阵亡绝不显示身份(引擎日志行脱敏)
    const txt = mapLogNames(String(l.txt).replace(/身份: [^(]+\(内奸死亡不公开[^)]*\)/, '身份: 不公开'));
    return `<div class="log-item ${l.cls||''}"><span class="t">R${l.t}</span>${txt}</div>`;
  }).join('');
  el.scrollTop = el.scrollHeight;
}
function openModal(title, html){
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = html;
  document.getElementById('modal').classList.add('show');
}
function closeModal(){ document.getElementById('modal').classList.remove('show'); }
function hint(html){
  const el = document.getElementById('hint-line');
  if (el) el.innerHTML = '<span class="kbd" style="color:var(--blue)">' + html + '</span>';
}
let toastTimer = null;
function toast(msg){
  const el = document.getElementById('toast');
  if (!el) { openModal('提示', `<div style="color:var(--red)">${esc(msg)}</div><button class="btn sm" onclick="closeModal()">知道了</button>`); return; }
  el.textContent = msg;
  el.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.style.display = 'none'; }, 2600);
}
/* L: 日志命名映射(黑话→通俗), 与卡面双名保持一致 */
let _cardNamePairsCache = null;
function cardNamePairs(){
  if (_cardNamePairsCache) return _cardNamePairsCache;
  const pairs = [];
  for (const key of Object.keys(O.CARDS)) {
    const spec = O.CARDS[key];
    if (spec && spec.name && spec.plain && spec.name !== spec.plain) pairs.push([spec.name, spec.plain]);
  }
  pairs.sort((a, b) => b[0].length - a[0].length); // 长名先替换,避免子串截断
  _cardNamePairsCache = pairs;
  return pairs;
}
function mapLogNames(txt){
  if (!document.body.classList.contains('plain-mode')) return txt;
  let out = txt;
  for (const [name, plain] of cardNamePairs()) out = out.split(name).join(plain);
  return out;
}

/* ---------- 渲染 ---------- */
function render(){
  if (!g) return;
  const v = O.publicView(g, HUMAN);
  document.getElementById('event-banner').textContent = `${O.suitZh[v.eventSuit]} ${v.event.name} — ${v.event.desc}`;
  document.getElementById('turn-info').textContent = '▶ ' + g.players[v.turn].name + ' 行动中';
  document.getElementById('room-info').textContent = `#${v.round}轮 · ${v.deck}牌 · 弃${v.discard}`;

  // 座位
  const grid = document.getElementById('seat-grid');
  const others = v.others;
  const rows = [others.slice(0, 3), others.slice(3, 5)];
  rows[1].splice(1, 0, { me: true });
  grid.innerHTML = rows.map((row, ri) => `<div class="seat-row">${row.map((q, i) => seatHtml(q, v, ri, i)).join('')}</div>`).join('');

  // 手牌
  const me = v.me;
  const idtName = (O.IDENTITIES && O.IDENTITIES[me.identity]) ? O.IDENTITIES[me.identity].name : me.identity;
  document.getElementById('hand-note').textContent = `手牌 ${me.hand.length} · 上限 ${me.handLimit} · 灵感 ${me.mp}/${me.mpMax} · ${me.identity === 'lord' ? '主公(公开)' : '你是' + idtName}`;
  const hand = document.getElementById('hand');
  hand.innerHTML = me.hand.map((c, i) => {
    const spec = O.CARDS[c.key] || {};
    const cls = c.type === 'trick' ? 'card trick' : c.type === 'equip' ? 'card equip' : c.type === 'unit' ? 'card unit' : 'card';
    const sel = (selected === i ? ' selected' : '') + (discardMode && discardSel.has(i) ? ' discard-sel' : '');
    const suitCls = isRedSuit(c.suit) ? 'red' : 'black';
    const isFun = !!(spec.fun || c.fun);
    const qa = spec.desc ? ` — ${spec.desc}` : '';
    return `<div class="${cls}${sel}" data-i="${i}" title="${esc(c.name)}(${esc(c.plain)}) 💡${c.cost}${esc(qa)}"><span class="cost">💡${c.cost}</span><span class="suit ${suitCls}">${O.suitZh[c.suit]}${c.num}</span><span class="cname name-zh">${esc(c.name)}</span><span class="cname name-plain">${esc(c.plain)}</span><span class="csub name-zh">${esc(c.plain)}</span><span class="csub name-plain">${esc(c.name)}</span><span class="ctype">${typeZh(c.type)}${isFun ? ' · 🎲' : ''}</span></div>`;
  }).join('');

  // 阶段提示
  const ph = document.getElementById('phase-info');
  const myTurn = v.isMyTurn && !me.dead;
  ph.textContent = me.dead ? '你已阵亡(观战)' : myTurn ? `你的行动阶段 · 灵感 ${me.mp}` : '等待其他玩家…';
  document.getElementById('btn-end').disabled = !(myTurn && !v.pending);
  document.getElementById('hint-line').innerHTML = me.dead ? '<span class="kbd">你已阵亡 · 可开启自动托管观战</span>' : '<span class="kbd">点击手牌出牌 · 攻击/指定类需选目标 · 装备/单位直接打出 · 欢乐牌可弃置保底</span>';
  if (tutorOn && myTurn && !v.pending && !me.dead) document.getElementById('hint-line').innerHTML = `<span class="kbd" style="color:var(--green)">🎓 ${TUTOR_TIPS[tutorIdx % TUTOR_TIPS.length]}</span>`;

  // 技能按钮区(按职业动态显示)
  const skillEl = document.getElementById('skill-row');
  const sk = SKILLS[me.prof && me.prof.id];
  if (sk && myTurn && !v.pending) {
    let dis = false, tip = sk.desc;
    if (sk.limited && usedLimited.has(sk.name)) { dis = true; tip = '限定技已使用'; }
    else if (sk.need && me.hand.length < sk.need) { dis = true; tip = '需要弃' + sk.need + '张手牌'; }
    else if (sk.needRed && !me.hand.some(c => isRedSuit(c.suit))) { dis = true; tip = '需要1张红色手牌'; }
    skillEl.style.display = '';
    skillEl.innerHTML = `<button class="btn sm" data-skill="${sk.name}" ${dis ? 'disabled' : ''} title="${esc(tip)}">✨ ${esc(sk.zh)}${dis ? '(条件不足)' : ''}</button>`;
  } else {
    skillEl.style.display = 'none';
  }

  logToHtml(v);
  // P6a: 胜利/失败横幅动画触发(仅挂 CSS 类,不动引擎调用)
  document.getElementById('table-title').classList.toggle('game-over', !!v.over);
  if (v.over) {
    document.getElementById('table-title').innerHTML = `<b>游戏结束</b> ｜ ${esc(v.winner)} 获胜 ｜ <button class="btn sm" onclick="showAchievements()">🏆 成就结算</button> ｜ <button class="btn sm" onclick="restart()">再来一局</button>`;
    if (!gameOverShown && !v.pending) {
      gameOverShown = true;
      stopTimers();
      showAchievements();
    }
  } else {
    document.getElementById('table-title').innerHTML = `<b>牌桌 · ${g.players.length} 人局</b> ｜ 【<span class="name-zh">做法假了</span><span class="name-plain">攻击</span>】可攻击任意玩家 · 守擂单位挡刀`;
  }

  // 响应提示(按 pending.type 分派)
  if (v.pending && isMyPending(v.pending)) {
    const key = pdKeyOf(v.pending);
    if (key !== shownPromptKey) { shownPromptKey = key; renderPendingPrompt(v); }
  } else {
    shownPromptKey = '';
  }

  // 手写快排按钮可见性
  document.getElementById('btn-ksp').style.display = (me.weaponKey === 'wKsp' && me.hand.length >= 2 && v.isMyTurn && !v.pending) ? '' : 'none';
  if (mode !== 'fang') document.getElementById('btn-fang-confirm').style.display = 'none';

  // 行动/响应限时同步
  syncTimers();
}

function seatHtml(q, v, ri, i){
  const isMe = !!q.me;
  const id = isMe ? HUMAN : q.id;
  const p = isMe ? v.me : g.players[id];
  const deadCls = p.dead ? ' dead' : '';
  const meCls = isMe ? ' me' : '';
  const tgt = (q.id !== undefined) && seatTargetable.has(id) ? ' targetable' : '';
  const halo = (v.turn === id && !p.dead) ? '<div class="turn-halo"></div>' : '';
  // H10: 阵亡玩家身份一律显示通用「身份隐藏·已阵亡」,绝不显示内奸
  const ident = isMe
    ? `👑 ${v.me.identity === 'lord' ? '主公·公开' : (O.IDENTITIES && O.IDENTITIES[v.me.identity] ? O.IDENTITIES[v.me.identity].name : v.me.identity)}`
    : (p.dead
      ? '<span class="ident hidden">身份隐藏·已阵亡</span>'
      : '<span class="ident hidden">身份隐藏</span>');
  const hpOn = p.hp, hpOff = p.maxHp - p.hp;
  const mpOn = Math.min(p.mp, p.mpMax), mpOff = p.mpMax - mpOn;
  const chips = [];
  if (p.weapon) chips.push(`<span class="eq">⚔ ${esc(isMe ? v.me.weapon : q.weapon)}</span>`);
  if (p.armor) chips.push(`<span class="eq">🛡 ${esc(isMe ? v.me.armor : q.armor)}</span>`);
  const units = isMe ? v.me.units : q.units;
  for (const u of units) chips.push(`<span class="unit-chip">🔹 ${esc(u)}</span>`);
  const delays = isMe ? v.me.delayArea : q.delayArea;
  for (const d of delays) chips.push(`<span class="judge-chip">🕐 ${esc(d)}</span>`);
  return `<div class="seat${deadCls}${meCls}${tgt}" data-seat="${isMe ? 'me' : id}">
    ${halo}
    <div class="seat-top"><span class="mono" style="color:var(--faint)">${isMe ? '你' : (id + 1) + '号'}</span>${ident}</div>
    <div class="head">
      <div class="avatar">${AVATARS[id]}</div>
      <div class="who"><div class="nick">${esc(p.name)}</div><div class="job"><span class="name-zh">${esc(p.prof.name)}</span><span class="name-plain">${esc(p.prof.plain)}</span> · ${p.maxHp}体力${p.awaken ? ' · ✨觉醒' : ''}</div></div>
    </div>
    <div class="stat"><span>❤</span><span class="cells">${cells(hpOn, hpOff, '♥')}</span><span class="val">${p.hp}/${p.maxHp}</span></div>
    <div class="stat mp"><span>💡</span><span class="cells">${cells(mpOn, mpOff, '●')}</span><span class="val">${p.mp}/${p.mpMax}</span></div>
    ${chips.length ? `<div class="chips">${chips.join('')}</div>` : ''}
  </div>`;
}

/* ---------- 交互 ---------- */
const NEED_TARGET = ['attack','attackEvo','dismantle','steal','pierce','o2','duel','skipPlay','delaySkipPlay','delaySkipDraw','gift','funReport','funArgue','killUnit','funBetray'];
const seatTargetable = new Set();
let mode = 'single';      // single | fang | ksp | skill | fun
let fangTargets = [];     // 放手一搏多目标
let fangCardIdx = -1;

function showFunButtons(){
  document.getElementById('btn-fun-play').style.display = '';
  document.getElementById('btn-fun-discard').style.display = '';
}
function hideFunButtons(){
  document.getElementById('btn-fun-play').style.display = 'none';
  document.getElementById('btn-fun-discard').style.display = 'none';
}

document.getElementById('hand').addEventListener('click', e => {
  const cardEl = e.target.closest('.card');
  if (!cardEl || !g) return;
  const i = +cardEl.dataset.i;
  const v = O.publicView(g, HUMAN);
  if (v.pending) return;
  if (discardMode) { toggleDiscardSel(i); return; } // L5: 弃牌选择模式
  const me = v.me;
  const c = me.hand[i];
  if (!c) return;
  const spec = O.CARDS[c.key] || {};
  const isFun = !!(spec.fun || c.fun);
  // 取消重选
  if (selected === i && (mode === 'single' || mode === 'fun')) {
    selected = -1; seatTargetable.clear(); mode = 'single';
    hideFunButtons(); render(); return;
  }
  // 欢乐牌: 选中后出现「打出 / 弃置触发保底」
  if (isFun) {
    selected = i; seatTargetable.clear(); mode = 'fun'; fangTargets = []; fangCardIdx = -1;
    showFunButtons(); render();
    hint(`已选欢乐牌【<span class="name-zh">${esc(c.name)}</span><span class="name-plain">${esc(c.plain)}</span>】· 打出 或 弃置触发保底 · ESC取消`);
    return;
  }
  tryPlaySelected(i, v, me, c);
});

function tryPlaySelected(i, v, me, c){
  const spec = O.CARDS[c.key] || {};
  selected = i;
  seatTargetable.clear();
  mode = 'single'; fangTargets = []; fangCardIdx = -1;
  hideFunButtons();
  // 放手一搏: 最后1张手牌的攻击可多目标
  if ((c.key === 'attack' || c.key === 'attackEvo') && me.weaponKey === 'wFang' && me.hand.length === 1) {
    mode = 'fang'; fangCardIdx = i;
    for (const q of g.players) if (q.id !== HUMAN && !q.dead) seatTargetable.add(q.id);
    render();
    document.getElementById('hint-line').innerHTML = `<span class="kbd" style="color:var(--blue)">【放手一搏】最后1张手牌: 点击选择1~3个目标,再按确认</span>`;
    document.getElementById('btn-fang-confirm').style.display = '';
    return;
  }
  // 神犇·碾压(被动): 黑色非攻击牌当作做法假了,进入目标模式(引擎按碾压处理)
  // 与引擎 playCard 碾压分支对齐: 响应牌(WA/特判/反制)不可当攻击,否则选定目标后会被引擎拒绝
  if (me.prof && me.prof.id === 'shenben' && !isRedSuit(c.suit) && !O.isAttackKey(c.key) && !O.isDodgeKey(c.key) && c.key !== 'counter' && c.key !== 'counterEvo') {
    for (const q of g.players) if (q.id !== HUMAN && !q.dead) seatTargetable.add(q.id);
    render();
    hint(`【神犇·碾压】黑色牌当作<span class="name-zh">做法假了</span><span class="name-plain">攻击</span>打出 · 点击一个目标 · ESC取消`);
    return;
  }
  if (spec.type === 'equip' || spec.type === 'unit' || !NEED_TARGET.includes(c.key)) {
    // 直接打出
    const r = spec.type === 'equip' ? O.equipCard(g, HUMAN, i) : spec.type === 'unit' ? O.deployUnit(g, HUMAN, i) : O.playCard(g, HUMAN, i, undefined);
    selected = -1;
    if (!r.ok && r.why) openModal('无法出牌', `<div style="color:var(--dim)">${esc(r.why)}</div><button class="btn sm" onclick="closeModal()">知道了</button>`);
    afterAction();
    return;
  }
  // 需要目标
  if (c.key === 'killUnit') {
    for (const q of g.players) if (q.id !== HUMAN && !q.dead && q.units.length) seatTargetable.add(q.id);
  } else {
    for (const q of g.players) if (q.id !== HUMAN && !q.dead) seatTargetable.add(q.id);
  }
  render();
  hint(`已选【<span class="name-zh">${esc(c.name)}</span><span class="name-plain">${esc(c.plain)}</span>】· 点击一个座位作为目标 · ESC取消`);
}

document.getElementById('seat-grid').addEventListener('click', e => {
  if (!g) return;
  const seatEl = e.target.closest('.seat');
  if (!seatEl) return;
  const id = +seatEl.dataset.seat;
  if (isNaN(id) || !seatTargetable.has(id)) return;
  if (mode === 'fang') {
    const idx = fangTargets.indexOf(id);
    if (idx >= 0) fangTargets.splice(idx, 1);
    else if (fangTargets.length < 3) fangTargets.push(id);
    document.getElementById('btn-fang-confirm').textContent = `⚔ 确认攻击${fangTargets.length}个目标`;
    render();
    return;
  }
  if (mode === 'ksp') {
    const r = O.kspAttack(g, HUMAN, id);
    selected = -1; seatTargetable.clear(); mode = 'single';
    if (!r.ok && r.why) openModal('无法出牌', `<div style="color:var(--dim)">${esc(r.why)}</div><button class="btn sm" onclick="closeModal()">知道了</button>`);
    afterAction();
    return;
  }
  if (mode === 'skill') {
    const r = O.skillUse(g, HUMAN, skillTargetName, id);
    selected = -1; seatTargetable.clear(); mode = 'single';
    const sk = SKILLS[O.publicView(g, HUMAN).me.prof && O.publicView(g, HUMAN).me.prof.id];
    if (!r.ok && r.why) openModal('无法使用技能', `<div style="color:var(--dim)">${esc(r.why)}</div><button class="btn sm" onclick="closeModal()">知道了</button>`);
    else if (sk && sk.limited) usedLimited.add(sk.name);
    afterAction();
    return;
  }
  const r = O.playCard(g, HUMAN, selected, id);
  selected = -1; seatTargetable.clear(); mode = 'single';
  if (!r.ok && r.why) openModal('无法出牌', `<div style="color:var(--dim)">${esc(r.why)}</div><button class="btn sm" onclick="closeModal()">知道了</button>`);
  afterAction();
});

let discardMode = false;
const discardSel = new Set();
function endPlayFlow(){
  if (!g || O.publicView(g, HUMAN).pending) return;
  const v = O.publicView(g, HUMAN);
  const over = Math.max(0, v.me.hand.length - v.me.handLimit);
  if (over > 0 && !discardMode) {
    // 进入弃牌选择模式(L5)
    discardMode = true;
    discardSel.clear();
    document.getElementById('btn-end').textContent = `✓ 确认弃牌(0/${over})`;
    render();
    document.getElementById('hint-line').innerHTML = `<span class="kbd" style="color:var(--orange)">弃牌阶段: 点击选择要弃的牌(需弃${over}张), 再点「确认弃牌」</span>`;
    return;
  }
  if (discardMode) {
    if (discardSel.size !== over) return; // 数量不符
    const r = O.discardCards ? O.discardCards(g, HUMAN, [...discardSel]) : { ok: false, why: '引擎不支持自选弃牌' };
    if (r && r.ok === false) { toast(r.why || '弃牌失败,请重新选择'); return; } // L: 失败保留选择并提示,不清除
    discardMode = false; discardSel.clear();
    document.getElementById('btn-end').textContent = '✓ 结束出牌';
  }
  stopTimers();
  O.discardPhase(g, HUMAN);
  selected = -1; seatTargetable.clear(); mode = 'single'; fangTargets = [];
  hideFunButtons();
  document.getElementById('btn-fang-confirm').style.display = 'none';
  O.endTurn(g, HUMAN);
  if (tutorOn) tutorIdx = (tutorIdx + 1) % TUTOR_TIPS.length;
  // 进化选择(若有候选)
  const ew = O.publicView(g, HUMAN).evoWait || g.evoWait;
  if (ew) { renderEvoPrompt(ew); return; }
  runAi();
}
function toggleDiscardSel(i){
  if (discardSel.has(i)) discardSel.delete(i); else discardSel.add(i);
  const v = O.publicView(g, HUMAN);
  const over = Math.max(0, v.me.hand.length - v.me.handLimit);
  document.getElementById('btn-end').textContent = `✓ 确认弃牌(${discardSel.size}/${over})`;
  render();
}
document.getElementById('btn-end').addEventListener('click', endPlayFlow);
document.getElementById('btn-cancel').addEventListener('click', () => {
  selected = -1; seatTargetable.clear(); mode = 'single'; fangTargets = [];
  hideFunButtons();
  if (discardMode) { discardMode = false; discardSel.clear(); document.getElementById('btn-end').textContent = '✓ 结束出牌'; }
  document.getElementById('btn-fang-confirm').style.display = 'none';

});
document.getElementById('btn-auto').addEventListener('click', () => {

});
document.addEventListener('keydown', e => {

/* ---------- 响应弹窗(pending.type 分派) ---------- */
function isMyPending(pd){
  if (!pd) return false;
  if (pd.attacker === HUMAN) return true;             // cold/bbst/chase 等人类(武器持有者)被询问
  if (pd.target === HUMAN || pd.victim === HUMAN) return true;
  if (pd.helpers && pd.helpers.some(h => h.id === HUMAN)) return true;
  return false;
}
function pdKeyOf(pd){
  return [pd.type, pd.attacker, pd.target, pd.victim, pd.trickKey,
    (pd.helpers || []).map(h => h.id).join(','),
    (pd.ctx && pd.ctx.betrayAvail) ? 'B' : '', g.turn, g.round].join('|');
}
function renderPendingPrompt(v){
  const pd = v.pending;
  const count = `<div style="font-size:12px;color:var(--dim)"><span id="resp-count">⏱ 10s</span> · 超时视为「否」</div>`;
  if (pd.type === 'dodge') renderDodgePrompt(v, count);
  else if (pd.type === 'counter') renderCounterPrompt(v, count);
  else if (pd.type === 'cold' || pd.type === 'bbst' || pd.type === 'chase' || pd.type === 'guard') renderWeaponPrompt(v, count, pd.type);
  else if (pd.type === 'aoeResp') renderAoePrompt(v, count);
  else if (pd.type === 'report') renderReportPrompt(v, count);
  else if (pd.type === 'harvest') renderHarvestPrompt(v, count);
}

function renderAoePrompt(v, count){
  const pd = v.pending;

  const src = pd.srcId !== undefined ? pd.srcId : '?';

    <div style="display:flex;gap:10px;flex-wrap:wrap">

/* ---------- 题解大会(H 死锁修复): 选牌弹窗 / 默认响应 ---------- */
function harvestChoices(pd){
  if (pd && pd.ctx && pd.ctx.cards) return pd.ctx.cards;
  if (pd && pd.choices) return pd.choices;
  return [];
}
function harvestRespond(pd, choiceKey){
  if (!O.respondHarvest) return;
  // 契约: O.respondHarvest({choiceKey}); 兼容旧签名 (g, pid, choiceKey)
  if (O.respondHarvest.length >= 3) O.respondHarvest(g, pd && pd.victim != null ? pd.victim : HUMAN, choiceKey);
  else O.respondHarvest({ choiceKey: choiceKey });
}
function harvestFirstKey(pd){
  const cs = harvestChoices(pd);
  const c0 = cs[0];
  if (c0 === undefined || c0 === null) return null;
  return c0.key !== undefined ? c0.key : c0;
}
function renderHarvestPrompt(v, count){
  const pd = v.pending;
  const cs = harvestChoices(pd);
  const hcount = `<div style="font-size:12px;color:var(--dim)"><span id="resp-count">⏱ 10s</span> · 超时自动选第1张</div>`;
  const btns = cs.map(c => {
    const key = c && c.key !== undefined ? c.key : c;
    const spec = O.CARDS[key] || {};
    const name = spec.name || (c && c.name) || key;
    const plain = spec.plain || (c && c.plain) || name;
    return `<button class="btn green" onclick="harvestPick('${esc(key)}')">🃏 <span class="name-zh">${esc(name)}</span><span class="name-plain">${esc(plain)}</span></button>`;
  }).join('');
  openModal('📚 题解大会 · 轮到你选牌', hcount + `
    <div style="font-size:13px;color:var(--dim)">【题解大会】翻开的手牌按行动顺序各选1张,请选择你要的牌(可跳过):</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">${btns || '<span style="color:var(--faint)">已无剩余牌可选</span>'}</div>
    <div style="display:flex;gap:10px"><button class="btn sm" onclick="harvestPick(null)">⏭ 跳过(不选)</button></div>`);
}
function harvestPick(choiceKey){
  harvestRespond(g && g.pending, choiceKey);
  closeModal();
  afterAction();
}

      opts.map(o => `<button class="btn danger sm" onclick="betrayResp(${o.id})">🙅 ${esc(o.name)}</button>`).join('') + '</div>';

    <div style="font-size:13px">${esc(playerName(pd.attacker))} 用【<span class="name-zh">做法假了</span><span class="name-plain">攻击</span>】攻击你(伤害${pd.dmg !== undefined ? pd.dmg : 1})。</div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn green" onclick="dodgeResp(true)">🛡 出 <span class="name-zh">WA</span><span class="name-plain">闪避</span>(1灵感)</button>
      <button class="btn danger" onclick="dodgeResp(false)">不出,受伤害</button>

function dodgeResp(yes){

function dodgeHelperResp(helperId){

function betrayResp(targetId){

  afterAction();
}

function renderCounterPrompt(v, count){

  // M1: 引擎并行修复后 pending 透出 srcId; 防御式回退到 attacker/'?'
  const src = pd.srcId !== undefined ? pd.srcId : (pd.attacker != null ? pd.attacker : '?');
  const spec = O.CARDS[pd.trickKey];
  openModal('🛡 锦囊指向你!', count + `
    <div style="font-size:13px">${esc(playerName(src))} 对你使用【<span class="name-zh">${esc(spec ? spec.name : pd.trickKey)}</span><span class="name-plain">${esc(spec ? spec.plain : pd.trickKey)}</span>】。要用【特判 / 反制】抵消吗(1灵感)?</div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn green" onclick="counterResp(true)">🛡 使用特判抵消</button>
      <button class="btn danger" onclick="counterResp(false)">不抵消,接受效果</button>
    </div>`);
}
function counterResp(yes){
  O.respondCounter(g, HUMAN, yes);
  closeModal();
  afterAction();
}

function renderWeaponPrompt(v, count, type){
  const pd = v.pending;
  const tname = esc(playerName(pd.victim != null ? pd.victim : pd.target));
  let title = '', body = '';
  if (type === 'cold') { title = '❄ 冷数据武器 · 缴械'; body = `你的攻击命中 ${tname}。是否改为弃置其2张手牌(不造成伤害)?`; }
  else if (type === 'bbst') { title = '🌲 平衡树武器 · 强命'; body = `你的攻击被 ${tname} 的WA抵消。是否弃1张手牌强制命中?`; }
  else if (type === 'chase') { title = '🐕 不死心武器 · 追击'; body = `你的攻击被 ${tname} 的WA抵消。是否立即再出一张攻击(每回合1次)?`; }
  else { title = '🛡 忠臣挡刀'; body = `${tname} 受到 ${esc(playerName(pd.attacker))} 的攻击(${pd.dmg != null ? pd.dmg : 1}伤害)。你是否弃1张手牌替主公承受伤害?`; }
  openModal(title, count + `

      <button class="btn green" onclick="yesNoResp('${type}',true)">✔ 是</button>
      <button class="btn danger" onclick="yesNoResp('${type}',false)">✘ 否</button>
    </div>`);
}
function yesNoResp(type, yes){
  if (type === 'cold') O.respondCold(g, HUMAN, yes);
  else if (type === 'bbst') O.respondBbst(g, HUMAN, yes);
  else if (type === 'chase') O.respondChase(g, HUMAN, yes);
  else if (type === 'guard') O.respondGuard(g, HUMAN, yes);
  closeModal();
  afterAction();
}
function respondNo(){
  const pd = g && g.pending;
  if (!pd) return;
  if (pd.type === 'dodge') O.respondDodge(g, HUMAN, false);
  else if (pd.type === 'counter') O.respondCounter(g, HUMAN, false);
  else if (pd.type === 'cold') O.respondCold(g, HUMAN, false);
  else if (pd.type === 'bbst') O.respondBbst(g, HUMAN, false);
  else if (pd.type === 'chase') O.respondChase(g, HUMAN, false);
  else if (pd.type === 'guard') O.respondGuard(g, HUMAN, false);
  else if (pd.type === 'aoeResp') O.respondAoeResp(g, HUMAN, false);
  else if (pd.type === 'report') { if (O.respondReport) O.respondReport(g, HUMAN, null); } // M2: 超时默认放弃举报(不弃牌)
  else if (pd.type === 'harvest') harvestRespond(pd, harvestFirstKey(pd));                   // H: 超时默认选第1张
  else return;
  closeModal();
  afterAction();
}

function renderEvoPrompt(ew){
  const keys = (ew.keys || []).map(k => typeof k === 'string' ? { base: k, evo: (O.EVO_MAP || {})[k], name: k } : k);
  const btns = keys.map(k => {
    const evoName = (k.evo && O.CARDS[k.evo]) ? O.CARDS[k.evo].name : (k.evo || '');
    const baseName = O.CARDS[k.base] ? O.CARDS[k.base].name : k.base;
    return `<button class="btn green" onclick="evoPick('${k.base}')">🃏 进化【${esc(baseName)}→${esc(evoName)}】</button>`;
  }).join('');
  openModal('🃏 进化选择(回合结束)', `
    <div style="font-size:13px;color:var(--dim)">本回合达成了进化条件,选择1张进化(每回合限1次,每局限3次):</div>
    ${btns || '<div style="color:var(--faint)">无可进化的手牌</div>'}
    <button class="btn sm" onclick="evoPick(null)">放弃进化</button>`);
}
function evoPick(key){
  O.evolvePick(g, HUMAN, key);
  closeModal();
  runAi();
}

function afterAction(){
  const v = O.publicView(g, HUMAN);
  if (v.pending && isMyPending(v.pending)) { render(); return; }
  const ew = v.evoWait || g.evoWait;
  if (ew) { renderEvoPrompt(ew); render(); return; }
  if (g.turn === HUMAN && !g.players[HUMAN].dead && !v.over) { render(); return; }
  runAi();
}

function runAi(){
  let guard = 0;
  while (!g.over && g.turn !== HUMAN && guard++ < 300) {
    const pid = g.turn;
    O.judgePhase(g, pid);
    O.drawPhase(g, pid);
    O.aiTurn(g, pid);
    if (g.pending) {
      if (isMyPending(g.pending)) break; // 等人类响应
      const pd = g.pending;
      aiRespondPending();
      if (g.pending === pd) break;       // 未知 pending 类型: 防死循环
      continue;
    }
  }
  // 人类回合开始
  if (!g.over && g.turn === HUMAN && !g.players[HUMAN].dead) {
    O.judgePhase(g, HUMAN);
    O.drawPhase(g, HUMAN);
  }
  render();
  if (autoMode && !g.over) autoLoop();
}
function aiRespondPending(){
  const pd = g.pending;
  if (!pd) return;
  if (pd.type === 'dodge') O.respondDodge(g, pd.target, true);
  else if (pd.type === 'counter') O.respondCounter(g, pd.victim, true);
  else if (pd.type === 'cold') O.respondCold(g, pd.target, false);
  else if (pd.type === 'bbst') O.respondBbst(g, pd.target, true);
  else if (pd.type === 'chase') O.respondChase(g, pd.target, true);
  else if (pd.type === 'guard') O.respondGuard(g, pd.target, true);
  else if (pd.type === 'aoeResp') O.respondAoeResp(g, pd.victim, true);
  else if (pd.type === 'report') { const cs = (pd.ctx && pd.ctx.cards) || []; if (O.respondReport && cs.length) O.respondReport(g, pd.victim, cs[0].key); }
  else if (pd.type === 'harvest') harvestRespond(pd, harvestFirstKey(pd));
}

function autoLoop(){
  if (!autoMode) return;
  if (!g || g.over) return;
  const v = O.publicView(g, HUMAN);
  const pd = v.pending;
  if (pd && isMyPending(pd)) {
    if (pd.type === 'dodge') O.respondDodge(g, HUMAN, true);
    else if (pd.type === 'counter') O.respondCounter(g, HUMAN, true);
    else if (pd.type === 'cold') O.respondCold(g, HUMAN, true);
    else if (pd.type === 'bbst') O.respondBbst(g, HUMAN, true);
    else if (pd.type === 'chase') O.respondChase(g, HUMAN, true);
    else if (pd.type === 'guard') O.respondGuard(g, HUMAN, true);
    else if (pd.type === 'aoeResp') O.respondAoeResp(g, HUMAN, true);
    else if (pd.type === 'report') { const cs = (pd.ctx && pd.ctx.cards) || []; if (O.respondReport && cs.length) O.respondReport(g, HUMAN, cs[0].key); }
    else if (pd.type === 'harvest') harvestRespond(pd, harvestFirstKey(pd));
  }
  const ew = v.evoWait || g.evoWait;
  if (ew && ew.keys && ew.keys.length) {
    const k0 = ew.keys[0];
    O.evolvePick(g, HUMAN, typeof k0 === 'string' ? k0 : k0.base);
  }
  if (g.turn === HUMAN && !g.players[HUMAN].dead) {
    O.aiTurn(g, HUMAN);
  }
  setTimeout(() => { afterAction(); }, 400);
}

/* ---------- 行动限时(铁律5): 出牌45秒 / 响应10秒 ---------- */
let timerKind = null, timerDeadline = 0;
function stopTimers(){ timerKind = null; timerDeadline = 0; }
function syncTimers(){
  if (!g || g.over) { stopTimers(); updateTimerDisplay(); return; }
  const v = O.publicView(g, HUMAN);
  const pd = v.pending;
  let want = null, secs = 0;
  if (pd && isMyPending(pd)) { want = 'resp:' + pdKeyOf(pd); secs = 10; }
  else if (v.isMyTurn && !v.me.dead && !autoMode) { want = 'turn:' + g.turn + ':' + g.round; secs = 45; }
  if (want === null) stopTimers();
  else if (timerKind !== want) { timerKind = want; timerDeadline = Date.now() + secs * 1000; }
  updateTimerDisplay();
}
function updateTimerDisplay(){
  const el = document.getElementById('timer-info');
  const ring = document.getElementById('timer-ring');
  if (!timerKind) { if (el) el.textContent = ''; if (ring) ring.style.display = 'none'; return; }
  const left = Math.max(0, Math.ceil((timerDeadline - Date.now()) / 1000));
  const isResp = timerKind.indexOf('resp:') === 0;
  if (el) {
    el.textContent = (isResp ? '⏱ 响应 ' : '⏱ ') + left + 's';
    el.style.color = left <= 10 ? 'var(--red)' : 'var(--orange)';
  }
  // L: 环形倒计时(conic-gradient), <=10s 变红并脉动
  if (ring) {
    ring.style.display = '';
    const total = isResp ? 10 : 45;
    const frac = Math.max(0, Math.min(100, (timerDeadline - Date.now()) / (total * 1000) * 100));
    ring.style.setProperty('--ring-frac', frac.toFixed(1));
    ring.style.setProperty('--ring-color', left <= 10 ? 'var(--red)' : 'var(--orange)');
    ring.classList.toggle('low', left <= 10);
    const tt = ring.querySelector('.tt');
    if (tt) tt.textContent = left + 's';
  }
  const rc = document.getElementById('resp-count');
  if (rc) { rc.textContent = '⏱ ' + left + 's'; rc.style.color = left <= 3 ? 'var(--red)' : 'var(--dim)'; }
}
setInterval(() => {
  if (!timerKind) return;
  if (Date.now() >= timerDeadline) {
    const kind = timerKind;
    stopTimers();
    updateTimerDisplay(); // 立即清空倒计时文本与圆环
    if (kind.indexOf('resp:') === 0) onRespTimeout();
    else onTurnTimeout();
  } else {
    updateTimerDisplay();
  }
}, 250);
function onTurnTimeout(){
  if (!g || g.over) return;
  const v = O.publicView(g, HUMAN);
  if (!(v.isMyTurn && !v.me.dead) || v.pending) return;
  document.getElementById('hint-line').innerHTML = '<span class="kbd" style="color:var(--red)">⏱ 45秒超时 · 自动结束出牌</span>';
  endPlayFlow();
}
function onRespTimeout(){
  if (!g || !g.pending || !isMyPending(g.pending)) return;
  respondNo();
}

/* ---------- 卡牌图鉴(L12) ---------- */
function showGallery(){
  const groups = [['basic','基本牌'],['trick','锦囊牌'],['equip','装备牌'],['unit','单位'],['evo','进化牌']];
  let html = '';
  let totalKinds = 0; // L: 按实际展示的牌型数统计标题
  for (const [t, label] of groups) {
    const cards = Object.entries(O.CARDS).filter(([,s]) => {
      const isEvo = s.desc && s.desc.indexOf('(进化)') >= 0;
      if (t === 'evo') return isEvo;
      return s.type === t && !isEvo && s.key !== 'aShield';
    });
    totalKinds += cards.length;
    html += `<div style="font-size:12px;color:var(--dim);margin:10px 0 4px">◆ ${label}(${cards.length})</div>` +
      `<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;max-height:200px;overflow:auto">` +
      cards.map(([,s]) => `<div style="border:1px solid var(--line2);border-radius:6px;padding:6px 8px;font-size:12px"><b class="name-zh">${esc(s.name)}</b><b class="name-plain">${esc(s.plain)}</b> <span style="color:var(--orange);font-family:var(--mono)">💡${s.cost}</span><div style="color:var(--faint);font-size:11px;line-height:1.4">${esc(s.desc || '')}</div></div>`).join('') + '</div>';
  }
  openModal(`🃏 卡牌图鉴 · 牌库120张 · ${totalKinds}种牌型(含进化牌)`, html + '<button class="btn sm" style="margin-top:8px" onclick="closeModal()">关闭</button>');
}
document.getElementById('btn-gallery').addEventListener('click', showGallery);

/* ---------- Solo 教学引导(L11 简化) ---------- */
let tutorOn = false, tutorIdx = 0;
const TUTOR_TIPS = [
  '① 点击手牌即可出牌,每张牌消耗💡灵感(卡面左上角费用)',
  '② 用【做法假了】攻击任意敌人——点击攻击牌,再点发光的座位',
  '③ 可部署单位(守擂单位会替你挡刀)或装备武器/防具',
  '④ 点「结束出牌」进入弃牌阶段,手牌弃至上限;回合结束翻评测机事件',
];
document.getElementById('btn-tutor').addEventListener('click', () => {
  tutorOn = !tutorOn;
  tutorIdx = 0;
  document.getElementById('btn-tutor').textContent = tutorOn ? '🎓 教学:关' : '🎓 教学模式';
  if (tutorOn) document.getElementById('hint-line').innerHTML = `<span class="kbd" style="color:var(--green)">${TUTOR_TIPS[0]}</span>`;
  else render();
});
function tutorNext(){
  if (!tutorOn) return;
  tutorIdx = (tutorIdx + 1) % TUTOR_TIPS.length;
  document.getElementById('hint-line').innerHTML = `<span class="kbd" style="color:var(--green)">${TUTOR_TIPS[tutorIdx]}</span>`;
}

/* ---------- 开局 ---------- */
function openSetupModal(){
  stopTimers();
  if (autoMode) { autoMode = false; document.getElementById('btn-auto').textContent = '▶ 自动托管(测试)'; }
  closeModal();
  openModal('🎮 人数选择', `
    <div style="font-size:13px;color:var(--dim)">选择玩家人数(3~6人) · 身份由引擎分配:</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      ${[3,4,5,6].map(n => `<button class="btn${n === 4 ? ' green' : ''}" onclick="startGame(${n})">${n} 人局</button>`).join('')}
    </div>
    <div style="font-size:12px;color:var(--faint)">主公固定0号(你)时公开显示 · 其余身份随机 · 名字取 NAMES 前 N 位</div>`);
}
function restart(){ openSetupModal(); }

function startGame(n){
  closeModal();
  g = O.createGame({ seed: Date.now() % 100000, human: HUMAN });
  O.setup(g, NAMES.slice(0, n));
  O.startTurn(g, 0);
  selected = -1; seatTargetable.clear(); mode = 'single'; fangTargets = [];
  usedLimited.clear(); gameOverShown = false; shownPromptKey = ''; skillTargetName = '';
  hideFunButtons();
  document.getElementById('btn-fang-confirm').style.display = 'none';
  // 人类是0号,开局即人类回合
  O.judgePhase(g, 0);
  O.drawPhase(g, 0);
  render();
  openStartModal();
}
function openStartModal(){
  const p = g.players[HUMAN];
  const idt = (O.IDENTITIES && O.IDENTITIES[p.identity]) || { name: p.identity, plain: '' };
  const idLine = p.identity === 'lord'
    ? '你是 <b style="color:var(--yellow)">主公(公开)</b>'
    : `你的身份: <b style="color:var(--yellow)">${esc(idt.name)}(${esc(idt.plain)})</b>`;
  const canRedraw = O.lordCanRedraw && O.lordCanRedraw(g);
  openModal('🎮 开局', `
    <div style="font-size:13px;line-height:1.7">${idLine} · 职业【<span class="name-zh">${esc(p.prof.name)}</span><span class="name-plain">${esc(p.prof.plain)}</span>】<br>${esc(p.prof.passive || '')}<br>规则速览: 用【<span class="name-zh">做法假了</span><span class="name-plain">攻击</span>】攻击任意玩家 · <span class="name-zh">WA</span><span class="name-plain">闪避</span>响应1费 · 守擂单位挡刀 · 手牌上限5</div>
    ${canRedraw ? `<button class="btn green" onclick="lordRedraw()">🔄 重洗起手牌(4张全≥3费可重洗一次)</button>` : ''}
    <button class="btn green" onclick="closeModal(); syncTimers();">开始游戏</button>`);
  stopTimers();
}
function lordRedraw(){
  if (!O.lordRedraw) { closeModal(); return; }
  O.lordRedraw(g);
  render();
  openStartModal();
}

/* ---------- 成就结算 ---------- */
function showAchievements(){
  const v = O.publicView(g, HUMAN);
  const ach = v.achievements || {};
  let rows = '';
  for (const pidStr of Object.keys(ach)) {
    for (const a of (ach[pidStr] || [])) {
      rows += `<div style="display:flex;align-items:center;gap:8px;font-size:12px"><span>🏅</span><span>${esc(playerName(+pidStr))} — ${esc(a.name)}</span><span style="margin-left:auto;color:var(--orange);font-weight:700">+${a.points}</span></div>`;
    }
  }
  openModal('🏆 游戏结束', `
    <div style="font-size:14px"><b>${esc(v.winner || '?')} 获胜</b></div>
    ${rows ? `<div class="ach-pop" style="display:flex;flex-direction:column;gap:6px;padding:8px;background:var(--panel2);border-radius:8px">${rows}</div>` : '<div style="font-size:12px;color:var(--faint)">本局无成就达成</div>'}
    <button class="btn green" onclick="restart()">↺ 再来一局</button>`);
}

openSetupModal();
